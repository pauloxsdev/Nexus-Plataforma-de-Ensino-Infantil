server.port=${PORT:8080}
server.address=${BIND_ADDRESS:127.0.0.1}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/nexus}
spring.datasource.username=${DATABASE_USER:nexus}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:0}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:30000}
spring.flyway.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=none
server.tomcat.max-http-form-post-size=64KB
nexus.origin=${APP_ORIGIN:${RENDER_EXTERNAL_URL:http://localhost:5173}}
nexus.secure-cookie=${SECURE_COOKIE:false}

nexus.login-ip-limit=${LOGIN_IP_LIMIT:100}
